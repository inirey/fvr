<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth or Dare ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        love: '#ff4d6d',
                        love2: '#ff758f',
                        player1: '#4D77FF',
                        player2: '#FF66A3',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        }
        .heart {
            position: absolute; font-size: 20px; color: rgba(255, 77, 109, 0.2);
            animation: float 8s infinite ease-in-out;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .btn-choice {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: hidden;
        }
        .btn-choice:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 15px 30px rgba(255, 77, 109, 0.3);
        }
        .result-text {
            opacity: 0; transform: translateY(20px);
            transition: all 0.5s ease;
        }
        .result-text.show { opacity: 1; transform: translateY(0); }
        .title { animation: titleBounce 2s infinite ease-in-out; }
        @keyframes titleBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 77, 109, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 109, 0); }
        }
        .player-tag {
            position: absolute; top: -10px; left: 50%;
            transform: translateX(-50%);
            padding: 5px 15px; border-radius: 20px;
            font-weight: bold; color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="bg-animation" id="bgAnim"></div>

<div class="min-h-screen flex items-center justify-center p-4 relative">
    <div class="container max-w-md w-full">
        <div class="card rounded-3xl p-8 relative">
            
            <!-- INDICATOR PLAYER TURN -->
            <div id="turnIndicator" class="player-tag bg-gradient-to-r from-player1 to-blue-400">
                Giliran: Kamu 💙
            </div>

            <!-- HEADER -->
            <div class="text-center mb-8 mt-6">
                <h1 class="title text-[clamp(2rem,5vw,3rem)] font-bold text-love mb-2">
                    Truth or Dare? <i class="fas fa-heart"></i>
                </h1>
                <p class="text-gray-500">Mode 2 Player ❤️ VS 💙</p>
                <div class="w-20 h-1 bg-gradient-to-r from-love to-love2 mx-auto mt-4 rounded-full"></div>
            </div>

            <!-- RESULT AREA -->
            <div id="resultBox" class="bg-rose-50 rounded-2xl p-8 mb-8 min-h-[180px] flex items-center justify-center transition-all duration-500 border-2 border-rose-100 relative">
                <div class="absolute -top-3 -left-3 bg-love text-white w-8 h-8 rounded-full flex items-center justify-center pulse">
                    <i class="fas fa-heart"></i>
                </div>
                <p id="resultText" class="result-text text-center text-gray-700 text-lg font-medium">
                    Siapa yang menang? Tekan tombol di bawah buat kasih hukuman! 👇
                </p>
            </div>

            <!-- TOMBOL LEMPAR TANTANGAN -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <button id="toPlayer1" class="btn-choice bg-gradient-to-r from-player1 to-blue-400 text-white py-3 px-2 rounded-xl font-semibold transition-all">
                    <i class="fas fa-user mr-2"></i> Ke Player 1 💙
                </button>
                <button id="toPlayer2" class="btn-choice bg-gradient-to-r from-player2 to-pink-400 text-white py-3 px-2 rounded-xl font-semibold transition-all">
                    <i class="fas fa-user-heart mr-2"></i> Ke Player 2 💖
                </button>
            </div>

            <!-- TOMBOL TRUTH & DARE -->
            <div class="grid grid-cols-2 gap-6">
                <button id="truthBtn" class="btn-choice bg-gradient-to-r from-blue-400 to-blue-500 text-white py-5 px-4 rounded-2xl font-semibold text-xl transition-all shadow-lg">
                    <i class="fas fa-comment-dots mr-2"></i><br>TRUTH
                </button>
                <button id="dareBtn" class="btn-choice bg-gradient-to-r from-love to-love2 text-white py-5 px-4 rounded-2xl font-semibold text-xl transition-all shadow-lg">
                    <i class="fas fa-fire mr-2"></i><br>DARE
                </button>
            </div>

            <div class="mt-6 text-center">
                <button id="resetBtn" class="text-sm text-gray-400 hover:text-love transition-colors duration-300">
                    <i class="fas fa-redo"></i> Reset
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // DAFTAR PERTANYAAN & TANTANGAN
    const truths = [
        "Siapa orang terakhir yang kamu stalking di sosmed?",
        "Apa hal paling memalukan yang pernah kamu lakuin?",
        "Kapan terakhir kali kamu bohong dan kenapa?",
        "Apa kebiasaan aneh yang kamu punya?",
        "Hal apa yang paling bikin kamu cemburu?",
        "Apa rahasia kecil yang belum pernah kamu ceritain?",
        "Apa pendapat pertama kamu waktu ketemu pasangan kamu?",
        "Kapan terakhir kali kamu nangis dan kenapa?",
        "Seberapa sayang kamu sama dia skala 1-100?",
        "Apa hal yang paling bikin kamu ilfeel?",
        "Apa mimpi teraneh yang pernah kamu alami?",
        "Apa makanan yang paling kamu benci?",
        "Hal konyol apa yang pernah kamu lakukan demi cinta?",
        "Siapa selebriti yang paling kamu taksir?",
        "Apa kebiasaan tidur kamu?",
        "Apa hal paling mahal yang pernah kamu beli?",
        "Kalau bisa jadi hewan, mau jadi apa?",
        "Apa lagu yang paling sering kamu dengerin?",
        "Apa hal yang paling kamu kangenin dari dia?",
        "Apa phobia kamu?",
        "Ceritain momen paling awkward di hidup kamu!"
    ];

    const dares = [
        "Panggil nama dia pake nada lagu yang lucu!",
        "Kirim voice note nyanyi lagu favorit dia.",
        "Posting foto dia di story kamu sekarang!",
        "Ucapkan 'I love you' pakai 3 bahasa berbeda.",
        "Lakukan gaya jalan ala model di depan kamera 1 menit.",
        "Makan satu sendok garam/cabe/saus (pilih yang ada).",
        "Tahan napas selama 20 detik.",
        "Pura-pura jadi kucing selama 1 menit.",
        "Deskripsikan dia pakai 3 kata sifat yang aneh.",
        "Kirim chat random ke temen bilang 'Aku kangen kamu'.",
        "Lakukan tarian TikTok yang lagi viral sekarang.",
        "Buka galeri dan tunjukin foto ke-10 terakhir.",
        "Pura-pura jadi orang yang lagi jatuh cinta parah.",
        "Bilang 5 hal yang kamu suka dari fisik dia.",
        "Tiduran di lantai selama 1 menit.",
        "Pake baju terbalik sampai giliran kamu lagi.",
        "Ceritain mimpi buruk pakai nada lagu sedih.",
        "Imitasi gaya bicara orang tua kamu.",
        "Lakukan 5 kali sit-up atau push-up sekarang.",
        "Bilang sesuatu dengan mulut penuh air/minum.",
        "Pura-pura jadi reporter berita.",
        "Kirim stiker paling norak yang ada di WA kamu.",
        "Bikin muka paling jelek dan fotoin.",
        "Bisikin sesuatu yang romantis ke dia.",
        "Janji bakal sayang dia selamanya ya! ❤️"
    ];

    // ELEMENTS
    const truthBtn = document.getElementById('truthBtn');
    const dareBtn = document.getElementById('dareBtn');
    const resultText = document.getElementById('resultText');
    const resultBox = document.getElementById('resultBox');
    const resetBtn = document.getElementById('resetBtn');
    const toPlayer1 = document.getElementById('toPlayer1');
    const toPlayer2 = document.getElementById('toPlayer2');
    const turnIndicator = document.getElementById('turnIndicator');

    let currentTarget = "Kamu";
    let currentColor = "player1";

    // FUNCTIONS
    function getRandomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function showResult(type) {
        resultText.classList.remove('show');
        
        setTimeout(() => {
            let text;
            if(type === 'truth') {
                text = getRandomItem(truths);
                resultBox.style.borderColor = '#93c5fd';
            } else {
                text = getRandomItem(dares);
                resultBox.style.borderColor = '#fda4af';
            }
            
            resultText.innerHTML = `<span class="font-bold text-${currentColor}">${currentTarget}:</span> ${text}`;
            resultText.classList.add('show');
        }, 300);
    }

    // EVENT LISTENERS
    truthBtn.addEventListener('click', () => showResult('truth'));
    dareBtn.addEventListener('click', () => showResult('dare'));
    
    resetBtn.addEventListener('click', () => {
        resultText.classList.remove('show');
        setTimeout(() => {
            resultText.innerHTML = "Siapa yang menang? Tekan tombol di bawah buat kasih hukuman! 👇";
            resultText.classList.add('show');
            turnIndicator.innerHTML = "Giliran: Kamu 💙";
            turnIndicator.className = "player-tag bg-gradient-to-r from-player1 to-blue-400";
        }, 300);
    });

    // FITUR BARU: LEMPAR KE PLAYER
    toPlayer1.addEventListener('click', () => {
        currentTarget = "Player 1 💙";
        currentColor = "player1";
        turnIndicator.innerHTML = `Giliran: ${currentTarget}`;
        turnIndicator.className = "player-tag bg-gradient-to-r from-player1 to-blue-400";
        resultText.classList.remove('show');
        setTimeout(() => {
            resultText.innerHTML = `Oke! Sekarang <b>Player 1</b> yang harus jawab. Pilih Truth atau Dare ya!`;
            resultText.classList.add('show');
        }, 300);
    });

    toPlayer2.addEventListener('click', () => {
        currentTarget = "Player 2 💖";
        currentColor = "player2";
        turnIndicator.innerHTML = `Giliran: ${currentTarget}`;
        turnIndicator.className = "player-tag bg-gradient-to-r from-player2 to-pink-400";
        resultText.classList.remove('show');
        setTimeout(() => {
            resultText.innerHTML = `Oke! Sekarang <b>Player 2</b> yang harus jawab. Pilih Truth atau Dare ya!`;
            resultText.classList.add('show');
        }, 300);
    });

    // BACKGROUND ANIMATION
    function createHeart() {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '<i class="fas fa-heart"></i>';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = Math.random() * 3 + 5 + 's';
        heart.style.fontSize = Math.random() * 20 + 10 + 'px';
        
        document.getElementById('bgAnim').appendChild(heart);
        
        setTimeout(() => { heart.remove(); }, 8000);
    }
    setInterval(createHeart, 300);

</script>
</body>
</html>
