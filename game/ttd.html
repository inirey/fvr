<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Center ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        love: '#ff4d6d',
                        love2: '#ff758f',
                        player1: '#4D77FF',
                        player2: '#FF66A3',
                        suit: '#FFB703',
                    },
                    fontFamily: { poppins: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            font-family: 'Poppins', sans-serif;
        }
        .card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.4);
        }
        .btn {
            transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-3px); }
        .tab.active { background: linear-gradient(135deg, #ff4d6d, #ff758f); color: white; }
        .result-text { transition: all 0.3s; }
    </style>
</head>
<body>

<div class="min-h-screen flex items-center justify-center p-4">
    <div class="container max-w-md w-full">
        <div class="card rounded-3xl p-6">
            
            <div class="text-center mb-6">
                <h1 class="text-[clamp(1.8rem,5vw,2.5rem)] font-bold text-love">
                    Game Center <i class="fas fa-gamepad"></i>
                </h1>
            </div>

            <!-- MENU TAB -->
            <div class="flex rounded-xl bg-gray-100 p-1 mb-6">
                <button id="tabTodo" class="tab active flex-1 py-2 rounded-lg font-semibold">Truth or Dare</button>
                <button id="tabSuit" class="tab flex-1 py-2 rounded-lg font-semibold text-gray-500">Suit</button>
            </div>

            <!-- ============================================== -->
            <!-- HALAMAN 1: TRUTH OR DARE -->
            <!-- ============================================== -->
            <div id="contentTodo">
                <div id="resultBox" class="bg-rose-50 rounded-2xl p-6 mb-6 min-h-[150px] flex items-center justify-center border-2 border-rose-100">
                    <p id="resultText" class="text-center text-gray-700 text-base font-medium">
                        Siapa yang menang? Tekan tombol di bawah! 👇
                    </p>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-5">
                    <button id="toPlayer1" class="btn bg-gradient-to-r from-player1 to-blue-400 text-white py-2 px-2 rounded-xl font-semibold text-sm">
                        <i class="fas fa-user mr-1"></i> Ke Player 1 💙
                    </button>
                    <button id="toPlayer2" class="btn bg-gradient-to-r from-player2 to-pink-400 text-white py-2 px-2 rounded-xl font-semibold text-sm">
                        <i class="fas fa-user-heart mr-1"></i> Ke Player 2 💖
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button id="truthBtn" class="btn bg-gradient-to-r from-blue-400 to-blue-500 text-white py-4 px-2 rounded-2xl font-semibold text-lg shadow-lg">
                        <i class="fas fa-comment-dots mr-1"></i><br>TRUTH
                    </button>
                    <button id="dareBtn" class="btn bg-gradient-to-r from-love to-love2 text-white py-4 px-2 rounded-2xl font-semibold text-lg shadow-lg">
                        <i class="fas fa-fire mr-1"></i><br>DARE
                    </button>
                </div>
            </div>
            
            <!-- ============================================== -->
            <!-- HALAMAN 2: BATU GUNTING KERTAS -->
            <!-- ============================================== -->
            <div id="contentSuit" class="hidden">
                <div class="text-center mb-4">
                    <p id="suitStatus" class="text-gray-600 font-medium">Pilih jagoanmu! 😎</p>
                </div>
                
                <div class="grid grid-cols-3 gap-4 mb-6">
                    <button id="btnBatu" class="btn bg-gradient-to-br from-suit to-orange-400 text-white p-4 rounded-2xl shadow-lg">
                        <div class="text-5xl mb-2">🪨</div>
                        <div class="font-bold text-lg">BATU</div>
                    </button>
                    <button id="btnGunting" class="btn bg-gradient-to-br from-suit to-orange-400 text-white p-4 rounded-2xl shadow-lg">
                        <div class="text-5xl mb-2">✂️</div>
                        <div class="font-bold text-lg">GUNTING</div>
                    </button>
                    <button id="btnKertas" class="btn bg-gradient-to-br from-suit to-orange-400 text-white p-4 rounded-2xl shadow-lg">
                        <div class="text-5xl mb-2">📄</div>
                        <div class="font-bold text-lg">KERTAS</div>
                    </button>
                </div>

                <div id="resultSuit" class="bg-yellow-50 border-2 border-yellow-400 rounded-2xl p-4 text-center">
                    <p class="text-yellow-800 font-bold text-xl">Hasil akan muncul disini!</p>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    // ==============================================
    // DATA
    // ==============================================
    const truths = [
        "Siapa orang terakhir yang kamu stalking?",
        "Apa hal paling memalukan yang pernah kamu lakuin?",
        "Kapan terakhir kali kamu bohong?",
        "Apa kebiasaan aneh yang kamu punya?",
        "Hal apa yang paling bikin kamu cemburu?",
        "Apa rahasia kecil yang belum pernah kamu ceritain?",
        "Seberapa sayang kamu sama dia skala 1-100?",
        "Apa mimpi teraneh yang pernah kamu alami?",
        "Apa hal yang paling kamu kangenin dari dia?",
        "Ceritain momen paling awkward di hidup kamu!"
    ];

    const dares = [
        "Panggil nama dia pake nada lagu yang lucu!",
        "Kirim voice note nyanyi buat dia sekarang.",
        "Posting foto dia di story kamu!",
        "Ucapkan 'I love you' pakai 3 bahasa.",
        "Lakukan gaya jalan ala model 1 menit.",
        "Makan satu sendok garam/cabe/saus.",
        "Pura-pura jadi kucing selama 1 menit.",
        "Deskripsikan dia pakai 3 kata sifat aneh.",
        "Lakukan tarian TikTok yang lagi viral.",
        "Janji bakal sayang dia selamanya ya! ❤️"
    ];

    // ==============================================
    // ELEMENTS
    // ==============================================
    const tabTodo = document.getElementById('tabTodo');
    const tabSuit = document.getElementById('tabSuit');
    const contentTodo = document.getElementById('contentTodo');
    const contentSuit = document.getElementById('contentSuit');

    const resultText = document.getElementById('resultText');
    const truthBtn = document.getElementById('truthBtn');
    const dareBtn = document.getElementById('dareBtn');
    const toPlayer1 = document.getElementById('toPlayer1');
    const toPlayer2 = document.getElementById('toPlayer2');

    const btnBatu = document.getElementById('btnBatu');
    const btnGunting = document.getElementById('btnGunting');
    const btnKertas = document.getElementById('btnKertas');
    const resultSuit = document.getElementById('resultSuit');
    const suitStatus = document.getElementById('suitStatus');

    let currentTarget = "Kamu";

    // ==============================================
    // FUNCTIONS
    // ==============================================
    function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    // SWITCH TAB
    tabTodo.addEventListener('click', () => {
        contentTodo.classList.remove('hidden');
        contentSuit.classList.add('hidden');
        tabTodo.classList.add('active');
        tabSuit.classList.remove('active');
    });

    tabSuit.addEventListener('click', () => {
        contentTodo.classList.add('hidden');
        contentSuit.classList.remove('hidden');
        tabTodo.classList.remove('active');
        tabSuit.classList.add('active');
    });

    // TRUTH OR DARE
    toPlayer1.addEventListener('click', () => { currentTarget = "Player 1 💙"; });
    toPlayer2.addEventListener('click', () => { currentTarget = "Player 2 💖"; });

    truthBtn.addEventListener('click', () => {
        resultText.innerHTML = `<b>${currentTarget}:</b> ${getRandom(truths)}`;
    });

    dareBtn.addEventListener('click', () => {
        resultText.innerHTML = `<b>${currentTarget}:</b> ${getRandom(dares)}`;
    });

    // SUIT GAME
    let choicesEmoji = { batu: '🪨', gunting: '✂️', kertas: '📄' };
    let myChoice = null;
    let botChoice = null; // Simulasi lawan

    function playSuit(choice) {
        myChoice = choice;
        const options = ['batu', 'gunting', 'kertas'];
        botChoice = options[Math.floor(Math.random() * options.length)];

        suitStatus.innerHTML = `Kamu: ${choicesEmoji[myChoice]} | Dia: ${choicesEmoji[botChoice]}`;

        let result = "";
        if(myChoice === botChoice) {
            result = "SERI! 😱 Main lagi yuk!";
        } else if(
            (myChoice === 'batu' && botChoice === 'gunting') ||
            (myChoice === 'gunting' && botChoice === 'kertas') ||
            (myChoice === 'kertas' && botChoice === 'batu')
        ) {
            result = "KAMU MENANG! 🎉 Dia yang kena hukuman!";
        } else {
            result = "KAMU KALAH! 😭 Sekarang giliranmu!";
        }
        resultSuit.innerHTML = `<p class="text-yellow-800 font-bold text-xl">${result}</p>`;
    }

    btnBatu.addEventListener('click', () => playSuit('batu'));
    btnGunting.addEventListener('click', () => playSuit('gunting'));
    btnKertas.addEventListener('click', () => playSuit('kertas'));

</script>
</body>
</html>
